<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>500 - Internal Server Error</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: "Segoe UI", sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:#050816;
    color:white;
}

/* Background */
body::before{
    content:"";
    position:absolute;
    inset:0;
    background:
      radial-gradient(circle at 20% 30%, rgba(0,255,255,.15), transparent 35%),
      radial-gradient(circle at 80% 70%, rgba(140,0,255,.18), transparent 35%),
      linear-gradient(135deg,#050816,#0a1025,#050816);
}

/* Grid */
.grid{
    position:absolute;
    inset:0;
    background:
      linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
    background-size:40px 40px;
    animation:moveGrid 12s linear infinite;
}

@keyframes moveGrid{
    from{transform:translateY(0);}
    to{transform:translateY(40px);}
}

/* Card */
.card{
    position:relative;
    width:90%;
    max-width:620px;
    text-align:center;
    padding:50px;
    border-radius:28px;
    background:rgba(255,255,255,.06);
    backdrop-filter:blur(16px);
    border:1px solid rgba(255,255,255,.12);
    box-shadow:0 0 50px rgba(0,255,255,.08);
}

/* Warning icon */
.icon{
    width:90px;
    height:90px;
    margin:auto;
    margin-bottom:20px;
    border-radius:50%;
    display:grid;
    place-items:center;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(0,255,255,.3);
    animation:pulse 2s infinite;
}

.icon svg{
    width:45px;
    fill:#57d8ff;
}

@keyframes pulse{
    50%{
        box-shadow:0 0 30px rgba(0,255,255,.4);
        transform:scale(1.05);
    }
}

/* 500 Text */
.code{
    font-size:110px;
    font-weight:900;
    line-height:1;
    letter-spacing:4px;
    background:linear-gradient(90deg,#57d8ff,#8b5cf6);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

h1{
    margin:12px 0;
    font-size:32px;
}

p{
    color:#c7d2fe;
    line-height:1.7;
    margin-bottom:30px;
}

/* Button */
.btn{
    display:inline-block;
    text-decoration:none;
    color:white;
    padding:14px 30px;
    border-radius:50px;
    background:linear-gradient(90deg,#2563eb,#8b5cf6);
    transition:.3s;
    font-weight:600;
}

.btn:hover{
    transform:translateY(-3px);
    box-shadow:0 12px 30px rgba(37,99,235,.4);
}

.status{
    margin-top:24px;
    font-size:13px;
    color:#94a3b8;
}

@media(max-width:480px){
    .code{font-size:82px;}
    h1{font-size:24px;}
    .card{padding:35px 25px;}
}
</style>

</head>
<body>

<div class="grid"></div>

<div class="card">

    <div class="icon">
        <svg viewBox="0 0 24 24">
            <path d="M1 21h22L12 2 1 21zm12-3h-2v2h2v-2zm0-8h-2v6h2V10z"/>
        </svg>
    </div>

    <div class="code">500</div>

    <h1>Internal Server Error</h1>

    <p>
        Server sedang mengalami gangguan internal.
        Tim kami mungkin sudah mendeteksinya—silakan coba lagi beberapa saat lagi.
    </p>

    <a href="/" class="btn">↻ Kembali ke Beranda</a>

    <div class="status">
        Status: HTTP 500 • Internal Server Error
    </div>

</div>

</body>
</html>
